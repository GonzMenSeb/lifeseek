[project]
name = "lifeseek"
version = "0.1.0"
description = "Directed, re-aimable Conway's-Game-of-Life discovery harness with a deterministic OSS core."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GonzMenSeb" }]
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Heavy / build-sensitive backends kept optional so the deterministic core
# (numpy reference path) always installs even where these wheels are unavailable.
lifelib = ["python-lifelib>=2.3.10"]
sat = ["python-sat>=1.8"]
mcp = ["mcp>=1.0"]

[project.scripts]
lifeseek = "lifecore.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifecore", "src/lifeseek_mcp", "src/lifeseek_runner"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-requests",
    "types-pyyaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
files = ["src", "tests"]
# lifelib / pysat / mcp are optional, untyped (or absent) backends.
[[tool.mypy.overrides]]
module = ["lifelib.*", "pysat.*", "mcp.*"]
ignore_missing_imports = true

# The MCP server registers tools via FastMCP's (untyped) decorator; that is inherent
# to the transport and confined to this thin wrapper.
[[tool.mypy.overrides]]
module = ["lifeseek_mcp.server"]
disallow_untyped_decorators = false
