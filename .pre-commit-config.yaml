# Pre-commit hooks: ruff (lint+format), mypy (strict), pytest on changed.
# Run `uv run pre-commit install` once to activate locally.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, numpy, types-requests, types-pyyaml]
        args: [--config-file=pyproject.toml]
        pass_filenames: false
  - repo: local
    hooks:
      - id: pytest
        name: pytest (quick)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        stages: [pre-commit]
